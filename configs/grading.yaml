# Quy tắc chấm (đăng ký trước). grader_version tăng khi đổi bất kỳ thứ gì dưới đây → chấm lại toàn bộ.
# 1.1.0 (26/9/2026, TRƯỚC đóng băng; theo phản biện bộ câu hỏi thí điểm T1.3, ghi DECISIONS):
#   - normalize_vi: đơn vị ml/kg (qua mg_per_ml → mg/kg → weight_kg), "amp"; phân số dạng bào chế "1⁄3 ống",
#     khoảng phân số "1/5-1/3 ống"; không có context tương ứng thì không quy đổi (không đoán).
#   - normalize_vi: HA viết tách ("tâm thu ≥ 140 … tâm trương ≥ 90", "HATT/HATTr", "SBP/DBP", "systolic/diastolic")
#     đọc thành MỘT giá trị HA; tuổi/thời gian ghép "3 tuổi 4 tháng", "3 years (and) 4 months" = MỘT giá trị (40 tháng).
#   - thuốc: bí danh/INN mới (lao, HIV, ACT của WHO trong P-malaria_ocr-02); phác đồ có tên (khóa nối "+", nở ra
#     thành INN thành phần); lớp thuốc (khóa nối "|", "tenofovir" thỏa MỘT mục cần một thành viên); combos gộp theo
#     cỡ lớn trước (BPaLM trước BPaL); bí danh đầu = tên hiển thị tiếng Việt (không để viết tắt đứng đầu).
#   - grade_short: phép "danh sách thuốc chứa cả phác đồ Bộ Y tế và phác đồ nước ngoài xung đột" xét theo TỪNG giá
#     trị nước ngoài (trước đây theo tên hệ thống: bản ghi WHO 2019 xung đột phủ quyết bản ghi WHO 2026 trùng Bộ Y tế);
#     khớp giá trị nước ngoài xung đột CHỈ nhờ tên lớp ("tenofovir" ~ TAF) là chưa rõ dạng, không phải phác đồ thứ hai.
#   - grade_mcq: vai trò nhiều token nối "|" ("superseded:3310/2019|foreign:US"), thứ tự ưu tiên như grade_short.
#   Sau phản biện độc lập bộ chấm (cùng ngày, vẫn 1.1.0 vì chưa chấm đầu ra nào bằng bản trung gian):
#   - _distinct: cùng giá trị nhắc lại có/không dấu so sánh ("130/80 … tâm thu ≥ 130 hoặc tâm trương ≥ 80",
#     "35 tuổi (từ 35 tuổi trở lên)") hoặc ở đơn vị khác ("0,15 mg (150 µg)") = MỘT giá trị (trước: 2 giá trị → nhãn 5).
#   - lớp thuốc TRUNG LẬP: chấm lại với từng thành viên; mọi cách thay cùng nhãn → nhãn đó; khác nhau (Bộ Y tế vs
#     nước ngoài) → nhãn 5, cờ underspecified (trước: ưu tiên Bộ Y tế). {1,2} lẫn nhau → 2.
#   - bí danh: "tenofovir alafenamid(e) fumarat(e)", "tenofovir disoproxil fumarat"; khoảng trắng = gạch nối trong bí
#     danh; phác đồ mồi BPaMZ (quy ước: thêm viết tắt cho nguồn nước ngoài thì thêm cả cho mồi/bản cũ); mã lao 1–2
#     chữ ("~cs", "~am", "~e", "~z", "~h", "~hh") chỉ đọc trong chuỗi phác đồ có ≥ 3 thuốc khác đã nhận.
#   - normalize_vi: "mg per kg", "mg cho mỗi kg", "mg/1 kg", "ml / kg", "micrograms per kilogram" = X/kg; "mL/kg per
#     hour" = ml/kg/h; "mg/kg mỗi ngày", "mg/kg cân nặng/ngày" = mg/kg/day; bộ chấm bỏ nồng độ chế phẩm ("1:1000",
#     "1‰", "1 mg/ml"); "nửa ống", "half an ampoule", "1 1/2 ống", "1/5 to 1/3 of an ampoule"; tuổi "3 years, 4
#     months", "3 yrs 4 mos", "3 tuổi rưỡi", khoảng "3 tuổi 4 tháng – 5 tuổi"; HA tách: thứ tự ngược, "HATTh",
#     "≥ 140 mmHg (tâm thu)"; cạnh đổi đơn vị ngày = 24 giờ (chính xác); repr Drugs/Cat sắp xếp (tái lập theo byte).
#   - grade_mcq: token vai trò lạ/sai hình thức → ValueError (trước: im lặng nhãn 5).
# 1.2.0 (26/9/2026, TRƯỚC đóng băng; MÙ với đầu ra thí điểm đã niêm phong — mọi ca thử là câu tự viết; ghi DECISIONS):
#   - cat: một câu trả lời nêu NHIỀU nhãn = nhiều giá trị (quy tắc nhiều giá trị như num/drugs: tất cả thuộc tập Bộ Y
#     tế → 2; không thì 5, hoặc 1 nếu quy thuộc nguồn rõ). Câu điều kiện "A; nếu không đáp ứng thì B" = hai giá trị
#     (không coi nhãn nêu trước là đáp án). Nhãn bị phủ định trong mệnh đề của nó ("không dùng X", "thay vì X",
#     "X rather than"... ; "X không được khuyến cáo") không tính — cùng một luật cho mọi nhãn (normalize_vi.parse_cats).
#   - HA: "140 over 90", "140 trên 90", "≥140/≥90"; "140 và 90 mmHg" (cần ngữ cảnh HA: mmHg sau số thứ hai hoặc
#     HA/huyết áp/BP trước; tâm trương ≤ 130, hiệu ≥ 20); khoảng "130–139/80–89" (cả dạng tách tâm thu/tâm trương) đọc
#     theo CẬN DƯỚI, BP(130, 80, '>=') — kiểu HA không có khoảng, mọi mẩu bp thí điểm là ngưỡng.
#   - bộ nối HA tách: thêm "hay", "và/hay", "hoặc là".
#   - đơn vị: "kg/m^2", "kg/m 2", "kg per m2", "kg·m-2" = kg/m2; "mg base" = mg (VI/EN); "18-month", "7-day" gắn đơn
#     vị; lũy thừa 10 ("2 x 10^3", "2×10³", "10^4 IU/mL", "2.10^4", "2e3") = một số ("× 10^9/L" vẫn là đơn vị);
#     copies/mL là đơn vị riêng, KHÔNG quy đổi sang IU/mL (hệ số tùy xét nghiệm) → câu trả lời copies/mL ở mẩu IU/mL
#     là unit_mismatch (nhãn 5).
#   - số viết bằng chữ trước đơn vị (VI/EN, ≤ 999): "bảy ngày", "mười lăm phút", "two weeks"; "twice daily" không là
#     giá trị; "mg/kg once daily", "mg/kg 1 lần/ngày" = mg/kg/day ("twice daily" không đổi).
#   - số thứ tự/nhãn liều-lượt không phải giá trị ("mũi 1", "mũi thứ 2", "liều 2", "lần 1", "dose 1", "18-month
#     visit", "mũi 18 tháng"): bị che khi câu còn giá trị khác; đứng một mình thì vẫn đọc. "2 liều", "liều 2 mg" giữ.
#   - thuốc: adefovir (ADV), telbivudine (LdT); bí danh "bpaz"; mã "~Pa@2" (đúng chữ hoa "Pa", đọc trong chuỗi có
#     ≥ 2 thuốc khác); phác đồ đánh vần rời "B-Pa-L", "B Pa L M" đọc khi ghép đúng một bí danh phác đồ.
#   - ghi nhận, KHÔNG đổi: mục tiêu dạng ngưỡng '< 140' với câu trả lời điểm '135' vẫn nhãn 5 (hạn chế).
#   Sau phản biện độc lập bộ chấm (cùng ngày, vẫn 1.2.0 vì chưa chấm đầu ra nào bằng bản trung gian; mù):
#   - cat, phủ định (normalize_vi.parse_cats): đọc từ phủ định trên chữ CÒN DẤU ("chứa" ≠ "chưa", "nó" ≠ "no",
#     "bộ" ≠ "bỏ"; câu không dấu đọc dạng không dấu); bộ từ phủ định VI↔EN theo cặp (không còn/no longer, không phải
#     lựa chọn đầu tay/not first-line, không khuyến cáo/not recommended, bỏ/dropping...); mệnh đề cắt thêm ở " - ",
#     "vì", "because", "since"; không xét phủ định cho lần khớp tự chứa từ phủ định hoặc là câu có/không trơn
#     ("Không - metamizol không nên dùng" = không); mẫu neo "^" khớp qua nhiều mệnh đề: nhãn đứng trừ khi lần nhắc
#     của mệnh đề cuối bị phủ định VÀ mẫu không nhận lần nhắc nào ở các mệnh đề trước; mẫu nhắc (không neo) khớp trong
#     một câu/mệnh đề ';'; dung môi ("trong", "in", "pha trong"...) chỉ khi đã nêu nhãn khác trước đó cùng mệnh đề.
#     Câu điều kiện/dự phòng ("chỉ dùng khi…", "only if…", "nếu không đáp ứng thì…") VẪN là giá trị thứ hai, mọi nhãn,
#     mọi thứ tự (mẫu colloid của P-dengue-03 còn nhánh làm lệch — chủ mẩu phải sửa, xem DECISIONS).
#   - tên mũi theo tuổi ("mũi 9 tháng", "the 9-month dose") là GIÁ TRỊ; chỉ che khi là mốc tham chiếu ("sau mũi 18
#     tháng", "kể từ", "after/following/since the 18-month dose").
#   - tần suất ("once a day", "twice daily", "ngày một lần", "1 lần/ngày") = một giá trị times/day (không phải thời
#     gian: "a day" không còn là 1 ngày); đếm "twice" = "hai lần" = "2 lần" (times); "một lần"/"once" đứng riêng không
#     đọc; "mười năm ngày" không đọc "năm" hai lần.
#   - HA: "120–129/<80" (đầu khoảng tâm thu, tâm trương không khoảng) và cặp so sánh ngược chiều ("≥140/<90",
#     "tâm thu ≥ 140 và tâm trương < 90") không phải một giá trị HA.
#   - số: "2*10^3" = 2×10³ (trước: 210 → mồi 200); khoảng lũy thừa "10^4–10^5 copies/mL", "từ 10^4 đến 10^5" = một
#     khoảng một đơn vị (trước: 10^4 đọc theo IU/mL của mẩu); "cps/mL", "copies per mL", "IU per mL"; tính từ giữa số
#     và đơn vị (EN) "three consecutive days" = "ba ngày liên tiếp"; "a hundred"; "năm tuổi"/"năm năm" = 5 (trừ "(năm
#     tuổi)", "năm tuổi thứ N"); "một/one" mở đầu MỆNH ĐỀ ("Theo Bộ Y tế: một tuần" = "Per MoH: one week"); "đợt/chu
#     kỳ 1" = "round/cycle 1" là số thứ tự. Mẫu neo đọc lại tối đa 50 mệnh đề (đầu ra lặp thoái hóa).
# 1.3.0 (27/9/2026, TRƯỚC đóng băng; cho NGHIÊN CỨU CHÍNH — thí điểm vẫn báo cáo bằng 1.2.0 (vnsoc.analysis.pilot từ
#   chối chấm lại bằng bản khác). Nguồn: kiểm bộ chấm thí điểm bằng AI (review/pilot_grading, 41 grader_error). Test hồi
#   quy là câu TỰ VIẾT mô phỏng từng loại lỗi, không chép đầu ra mô hình; sẽ kiểm trên tập giữ riêng trước đóng băng):
#   - E1 quy tắc 5 cho MỌI value_kind: dòng đáp án (hoặc chuỗi bộ tách LLM trả về) có SỐ mà không đọc được giá trị thuộc
#     kiểu của mẩu → nhãn 5 (unit_mismatch), không phải 6 ("0 mg" cho câu có/không, "4 tháng" cho danh sách thuốc,
#     "150 mmHg" một mình cho mẩu HA, "120–129/<80", "≥140/<90"). Không có dòng đáp án mà văn bản có số (hoặc tên thuốc,
#     mẩu cat) nhưng không đọc được giá trị → needs_llm (bộ tách dự phòng) thay vì 6. Ngoại lệ giữ như 1.2.0: câu cat có
#     NHẮC một hạng mục nhưng bị phủ định ("Dextran 40 không được khuyến cáo") vẫn 6 — số trong tên chế phẩm không được
#     làm khác nhãn so với "Ringer lactate không được khuyến cáo".
#   - E2 HA: "140 mmHg / 90 mmHg" (đơn vị sau từng phần) và "140 90 mmHg", "HA 140 90" (hai số cách nhau CHỈ bằng
#     khoảng trắng; cần mmHg sau một trong hai số hoặc HA/huyết áp/BP trước; tâm trương ≤ 130, hiệu ≥ 20; không phải đầu
#     khoảng "130-139 80-89"; dấu so sánh chỉ dạng ký hiệu) = MỘT giá trị HA; đọc SAU mọi dạng cũ.
#   - E3 chữ giữ chỗ của mẫu trả lời ("<unit>", "<đơn vị>"; thẻ "<b>") — bản nháp bỏ mọi khe <…>, đã SỬA sau phản biện
#     (xem dưới); "2 /ULN", "2 lần /ULN", "2x/ULN" = "2 x ULN". "2 <đơn vị>" (số trơn, không ULN) KHÔNG đọc thành
#     2×ULN (việc của chủ mẩu) → nhãn 5 theo E1.
#   - E4 thuốc: mọi thuốc câu trả lời nêu phải thuộc một phác đồ đã ghi mà nó nêu đủ key_drugs; thuốc của phác đồ = key_
#     drugs + thuốc có trong `text` đã ghi của mục, gộp qua mọi mục cùng giá trị (gap 0, vd WHO 2026 C1a có Eto = Bộ Y tế
#     C1a có Pto). Có thuốc thừa → phác đồ khác, không khớp nguồn nào → nhãn 5 (partial nếu nêu thuốc khóa Bộ Y tế). Một
#     luật cho Bộ Y tế/nước ngoài/bản cũ/mồi. Mục không có text: chỉ key_drugs (chặt). Danh sách chứa phác đồ Bộ Y tế
#     VÀ phác đồ bản cũ/mồi ngoài tập Bộ Y tế = hai giá trị (quy tắc 7, như phác đồ nước ngoài xung đột): 5, hoặc 1 nếu
#     quy thuộc nguồn nước ngoài rõ. `matches` (chứa) giữ nguyên cho kiểm span (verify_span.missing_vn_values).
#   - E5 thuốc: Truvada, Descovy, DRV/r, LPV/r (Kaletra, Aluvia), ATV/r, darunavir, ritonavir, lopinavir, atazanavir,
#     rifabutin, streptomycin, kanamycin (tên đầy đủ), "moxyfloxacin" (lỗi chính tả); chữ lao viết rời ("R H E", "R-H-E",
#     chữ HOA H/R/Z/E) gộp thành chuỗi mã trong parse_cats.
#   - E6 mẩu cat: dòng đáp án nêu tên thuốc (bảng `drugs`) mà không khớp hạng mục nào → nhãn 5 (parse_method
#     "unlisted"), không phải 6. (Mã chữ lao ngoài mẫu: xem phần sau phản biện.)
#   - Kiểm hồi quy: 65 mẩu thí điểm — render mọi giá trị (644 phép, VI+EN) lỗi 2→2, không đổi nhãn nào; text đầy đủ của
#     mọi mục thuốc không đổi nhãn; trắc nghiệm 368 phương án lỗi 8→8 (cách đếm theo phương án), không đổi;
#     tolerance/conflict_status 65 mẩu không đổi; missing_vn_values rỗng.
#   Sau phản biện độc lập bản nháp 1.3.0 (cùng ngày, vẫn 1.3.0: chưa chấm đầu ra nào của nghiên cứu chính; bản nháp chỉ
#   chạy chẩn đoán trong bộ nhớ trên thí điểm). Câu thử vẫn TỰ VIẾT; trên 390 câu trả lời ngắn thí điểm bản sửa cho
#   ĐÚNG nhãn như bản nháp (0 dòng đổi), các sửa dưới đây nhắm lỗi ngoài mẫu:
#   - E1 thứ tự quy tắc 5 (dòng đáp án/chuỗi LLM không có giá trị thuộc kiểu mẩu): (i) dòng đáp án HỎI LẠI quốc gia/hướng
#     dẫn nào và điều kiện A0 → 1; (ii) dòng đáp án là câu TỪ CHỐI ("không rõ/không biết/không đủ thông tin/chưa rõ",
#     "I don't know/unknown/not sure/insufficient information/unable to…") → 6; (iii) mới đến số → 5 / thuốc → 5;
#     (iv) hỏi lại ở thân bài + A0 → 1; (v) còn lại 6. Số KHÔNG tính cho (iii): nhãn thứ bậc/nhóm ("bậc 1", "type 2",
#     "2nd") và số lặp lại từ đề (population/condition/intervention của mẩu, cùng cận) nằm TRONG một cụm lặp đề ("PEP
#     within 72 hours", "standard 6-month regimen"); số trơn đứng một mình ("4 tháng") vẫn là câu trả lời → 5. Mẩu cat:
#     cụm từ chối không được đọc thành hạng mục ("Không rõ" ≠ "Không"). Mẩu num: số KHÔNG đơn vị vẫn đọc theo đơn vị mẩu
#     (quy tắc 3 đã đăng ký) — hạn chế ghi nhận.
#   - E1/HA đọc thêm (câu trả lời đúng từng bị 5): "≥140 mmHg or ≥90 mmHg" (mmHg sau CẢ hai số, hoặc/hay/or), "140 by 90",
#     "130–139 mmHg / 80–89 mmHg", dạng tách trộn "SBP 140 mmHg, 90 mmHg DBP"; BP_SPACE không đọc khi số thứ hai có chữ
#     theo sau ("≥ 140 mmHg 30 phút").
#   - E3 khe <…>: chỉ bỏ CHỮ MẪU ("<giá trị>", "<đơn vị>", "<value>", "<unit>", "<chữ cái>", "<letter>") và thẻ HTML; nội
#     dung khác GIỮ, bỏ dấu ngoặc ("<TDF>" → TDF, "4 <weeks>" → 4 tuần, "2 <times> /ULN" → 2 x ULN). Khe chỉ mở sau đầu
#     câu/khoảng trắng/( [ : và có chữ cái ngay sau "<"; "ALT<ULN", "< 140", "<5 tuổi", "DNA>2000" không bị đụng.
#   - E4 đối xứng: thuốc của một phác đồ = key_drugs + thuốc trong text của mục (gộp gap 0) + NỀN CỦA MẨU = mọi thuốc có
#     trong text của bất kỳ mục nào (Bộ Y tế/nước ngoài/bản cũ/mồi) mà không là key_drugs của mục nào (3TC/FTC ở PEP,
#     primaquine ở ACT); nền chung cho mọi nguồn nên nhãn không còn phụ thuộc text nguồn nào ghi đủ hơn. Tên lớp trong
#     text ("Tenofovir 300 mg") = thành viên là key của chính mục đó. Danh sách nối "+"/"plus"/"phối hợp"/"kết hợp"/
#     "with" và không có từ lựa chọn ("hoặc", "or", dấu phẩy, ";", ":", hết câu) = MỘT phác đồ: một phác đồ đã ghi phải
#     chứa đủ ("TDF + ETV" → 5, "TDF hoặc ETV" → 2; đối xứng "AL + AS-AQ" → 5, "AL or AS-AQ" → 4). Quy tắc 7 giữ cho danh
#     sách liệt kê ("TLD hoặc TLE").
#   - E4 phủ định trong danh sách thuốc: dùng luật phủ định của parse_cats cho từng lần nhắc thuốc ("không dùng EFV",
#     "TLD instead of TLE", "adefovir is no longer recommended", "moxifloxacin is omitted"), lan qua thuốc nối bằng
#     và/hoặc/hay/and/or/nor/+/&// (không qua dấu phẩy). Thêm từ phủ định (dùng chung cho cat): stop/discontinue/withdraw,
#     ngừng/ngưng (dừng: chỉ khi có dấu), "không phối hợp/kết hợp", "not combined with/plus", "(is) omitted/excluded/
#     dropped/removed/stopped/discontinued/withdrawn", "not continued/included/added", "bị/được/đã ngừng/loại bỏ",
#     "không tiếp tục/kèm".
#   - E4 quy nguồn: danh sách cả dòng không thuộc tập Bộ Y tế nhưng đọc theo từng đoạn (cắt ở tên nguồn như quy tắc 6) có
#     ≥ 2 danh sách, một thuộc tập Bộ Y tế → quy tắc 6 (1 nếu mọi phác đồ khác nằm sau tên nguồn nước ngoài, không thì 5).
#   - Mẩu cat mã lao (nhãn HRE/HR...): mã chữ HOA 3–5 chữ H/R/Z/E/S khác nhau (2 chữ khi có số đứng trước) mà mẫu của mẩu
#     không đọc theo thứ tự đã viết thì đọc theo thứ tự hoán vị DUY NHẤT mẫu đọc được ("E H R" → HRE); không đọc được →
#     "unlisted" 5 ("HRZE" trơn, "RHZ"); mã bị phủ định không tính.
#   - Từ điển/đơn vị: raltegravir, zidovudine (AZT, ZDV), abacavir, rilpivirine (RPV), "DHA-piperaquine"; "grams",
#     "gam", "milligram(s)".
#   - Bác bỏ (lý do trong DECISIONS): "tenofovir + lamivudine + dolutegravir" vẫn 5 underspecified (quy tắc 10 đã đăng
#     ký); "two-step (50 g then 100 g)" ở P-dm-05 là 2 (tập Bộ Y tế có two_step_allowed qua DR8); trường ignore_drugs
#     không thêm (nền của mẩu đã phủ primaquine).
#   - Kiểm hồi quy lặp lại: render 644 phép lỗi 2→2, 0 đổi; text mục thuốc 0 đổi; trắc nghiệm 368 phương án lỗi 8→8,
#     0 đổi; tolerance/conflict_status 65/65; missing_vn_values rỗng; 390 câu ngắn thí điểm: bản nháp → bản sửa 0 đổi.
# 1.3.1 (27/9/2026, TRƯỚC đóng băng; nghiên cứu chính; thí điểm vẫn 1.2.0). Nguồn: hiệu chỉnh trích mẩu 4 văn bản
#   (review/extraction_calibration) — 20–35% khuyến cáo bị bỏ vì bộ đọc không đọc được thuốc/đơn vị. Kiểm kê MỘT lần trên
#   lớp chữ (kể cả OCR) của 25 văn bản in_corpus: review/extraction_calibration/reader_inventory.md. Mù với đầu ra mô hình;
#   câu thử tự viết theo cách viết của kho (tests/test_normalize.py, tests/test_grade_fixes.py, mục 1.3.1).
#   - thuốc: +418 INN đơn, 9 phác đồ có tên, 1 lớp (LMWH), 970 bí danh (947 trên khóa mới, 23 thêm vào khóa cũ), 8 tổ hợp
#     cố định (combos: amoxicillin-clavulanate, co-trimoxazole = SMX + TMP, sacubitril-valsartan, piperacillin-/ceftolozane-
#     tazobactam, ampicillin-/cefoperazone-sulbactam, ceftazidime-avibactam); bí danh đầu = cách viết tiếng Việt nhiều
#     nhất trong kho; 396 thuốc đọc được trong kho, 22 không (18 thuốc cùng nhóm để câu trả lời nêu chúng là giá trị, nhãn
#     5, không phải từ chối — tiền lệ 1.3.0 E5; 4 chỉ có dạng kho không đọc được: 'BAL', 'sulbac tam', 'canxi' trơn…). Mã chuỗi 3 chữ HOA phân biệt hoa-thường, ≥ 2 thuốc khác: ~ABC@2,
#     ~RAL@2, ~PAS@2 ('ABC' đánh giá đường thở ≠ abacavir); ~km, ~cm (lao). 'SOF/DAC', 'SOF/LED' là bí danh phác đồ ('DAC'
#     đứng riêng = đặc). Không đọc: tên chất xét nghiệm trơn (kali, calci, magie, glucose, albumin), nhóm thuốc (statin,
#     SGLT2i, ACEi…), 'glucagon-like', 'kháng insulin' (normalize_vi.NOT_DRUG_RE), 'triệu' trơn ('4 triệu chứng').
#   - adjunct_drugs (mới): thuốc hỗ trợ không phải key_drugs của mục nào của mẩu thuộc mọi phác đồ (grade.regimen_drugs):
#     giữ nhãn 1.3.0 của 'TDF + 3TC + DTG + vitamin B6', 'AL + paracetamol' (trước đây các thuốc này vô hình).
#   - normalize_vi: 412 cách viết đơn vị mới → 96 đơn vị chuẩn mới (L/min, cmH2O, g/L, g/dL, mg/L, µmol/L, mEq/L,
#     mEq/L/h, mmol/L/h, °C/°, µg/kg/min, mg/kg/h, mL/h, mL/min, mL/min/1.73m2, drops/min, IU/kg/h, /min, ms, s, mm, ‰,
#     kcal, percentile, MIU…); khoảng trắng quanh '/' được đọc ('mg/ ngày' = 'mg/ngày'); dạng mỗi liều giữ đơn vị mỗi liều
#     ('mg/lần' = mg), dạng mỗi ngày là /day ('g/ngày'); cạnh quy đổi CHỈ khi chính xác (tiền tố SI, thời gian, định nghĩa;
#     mol↔khối lượng và mEq↔mmol chỉ khi context.analyte nêu chất; mg↔mg/day chỉ khi context.doses_per_day); không có cạnh
#     ml/min↔mL/min/1.73m2, days/week↔times/week, cmH2O↔mmHg, °F↔°C. 'G/L' (G hoa) = 10^9/L; '0,0625' là một số; liều tổ
#     hợp '49/51 mg', '37,5 mg/20 mg' = mỗi phần một giá trị; '2,4 triệu đơn vị' = 2,4 MIU; chữ số chỉ số dưới ('cmH₂O').
#   - Kiểm hồi quy: 65 mẩu thí điểm — render mọi giá trị (VI+EN) 0 đổi nhãn/vai trò; chấm text mọi mục 0 đổi;
#     tolerance/conflict_status 65/65; missing_vn_values rỗng; trắc nghiệm 368 phương án (chấm như câu ngắn): 4 đổi,
#     đều là phương án gây nhiễu 'metamizol xen kẽ paracetamol' 6 → 5 'unlisted' (đúng vai trò), lệch vai trò 8 → 4.
#     317 mẩu hiệu chỉnh: missing_vn_values đổi ở 24 mẩu, TẤT CẢ là mẩu ghi đơn vị thay thế vì bộ đọc cũ (l cho L/min, cm cho
#     cmH2O, g cho g/L, ug/kg cho µg/kg/phút, mg cho 'mg/ ngày', IU cho 'UI/ngày', day cho 'ngày/tuần'…); cả 24 qua khi đặt
#     đúng đơn vị thật (người trích phải sửa unit trước khi gộp).
grader_version: "1.3.1"
tolerance_rule: "half the minimum gap between the MoH value set and any other source value (foreign, superseded, decoy)"
partial_overlap: wrong_in_primary_reported_separately
multi_value_without_vn_designation: wrong_reported_separately
llm_extraction_fallback: {used_only_when: "no ĐÁP ÁN/ANSWER line and (>1 candidate values, or no value but a number (cat: or a stated drug name / TB code) in the text; 1.3.0)", manual_check_n: 500}
# adjunct_drugs (1.3.1): thuốc hỗ trợ/triệu chứng. Trong mẩu thuốc, một thuốc ở danh sách này mà KHÔNG là key_drugs của mục
#   nào của mẩu (Bộ Y tế/nước ngoài/bản cũ/mồi) được coi như thuốc nền (grade.regimen_drugs): 'TDF + 3TC + DTG + vitamin B6',
#   'AL + paracetamol' giữ nhãn của phác đồ (trước 1.3.1 các thuốc này không có trong bảng nên không được đọc; bảng lớn hơn
#   không được biến câu trả lời thành "phác đồ khác" = nhãn 5). Là key_drugs của một mục thì tính như mọi thuốc. Không có
#   NSAID (ibuprofen chống chỉ định trong SXHD), kháng sinh, thuốc đặc hiệu. Mẩu cat: không đổi (nêu thuốc ngoài hạng mục = 5).
adjunct_drugs: [paracetamol, retinol, pyridoxine, thiamine, cyanocobalamin, ascorbic-acid, vitamin-d, folic-acid, zinc,
                oral-rehydration-salts, ferrous-sulfate, ferrous-fumarate, ferrous-gluconate, calcium-carbonate,
                sodium-chloride, ringer-lactate, omeprazole, esomeprazole, pantoprazole, ranitidine, famotidine, cimetidine,
                ondansetron, metoclopramide, domperidone, diphenhydramine, chlorpheniramine, cetirizine, loratadine,
                promethazine, lactulose]
# drugs: khóa chuẩn -> bí danh (so khớp không dấu, chữ thường sau chuẩn hóa). Mở rộng khi gặp thuốc mới + thêm test.
#   - Khóa là một INN: bí danh đầu tiên là tên hiển thị tiếng Việt (qgen.render), nên để cách viết tiếng Việt/INN
#     trước viết tắt. Không dùng viết tắt 1–2 chữ (H, R, Z, E, Pa, Am, Cs) — quá mơ hồ; viết tắt ≥ 3 chữ.
#   - Khóa "a+b+c" (INN nối "+"): phác đồ có tên; bí danh (BPaL, TLD, Biktarvy…) nở ra thành các INN thành phần,
#     sau đó `combos` có thể gộp lại (BPaL). Không gộp TLD/TLE/Biktarvy/BDLC để giá trị mẩu ghi theo INN
#     ([tenofovir-disoproxil, dolutegravir], [bictegravir], [delamanid, clofazimine]) vẫn khớp.
#   - Khóa "a|b" (INN nối "|"): lớp thuốc (drug class); câu trả lời chỉ nêu lớp thỏa MỘT mục cần một thành viên;
#     grade_short chấm lại với từng thành viên (trung lập, xem grade.py). Mọi nơi đọc `drugs` như danh sách INN phải
#     bỏ khóa có "+" hoặc "|".
#   - Bí danh bắt đầu "~" (mã lao 1–2 chữ: Cs, Am, E, Z, H, Hh): chỉ đọc trong chuỗi phác đồ có ≥ 3 thuốc khác đã
#     nhận ("Bdq Lzd Cfz Cs", "4-6 Am-Lfx-Pto-Cfz-Z-H"); không bao giờ đọc đứng riêng. "~ma@n": ngưỡng n
#     thay cho 3; mã có chữ hoa so khớp phân biệt hoa-thường (1.2.0: "~Pa@2" — "Bdq, Pa, Lzd" = BPaL; "X-quang PA,
#     Bdq, Lzd" không đọc PA). 1.3.1: mã 3 chữ viết HOA mơ hồ ngoài chuỗi thuốc cũng theo luật này, luôn @2 trở lên
#     ("~ABC@2": "ABC + 3TC + DTG" = abacavir; "Đánh giá ABC, adrenalin" không đọc ABC; "~RAL@2", "~PAS@2").
#   - Phác đồ có tên đánh vần rời từng chữ ("B-Pa-L", "B Pa L M") đọc khi các chữ ghép lại đúng một bí danh của khóa
#     "a+b+c" (normalize_vi._spelled_regimens); không nới luật "~".
#   - Quy ước đối xứng: thêm viết tắt phác đồ cho một nguồn nước ngoài thì thêm viết tắt tương ứng của mồi/bản cũ.
