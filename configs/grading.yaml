  sofosbuvir+velpatasvir+voxilaprevir: [vosevi]
  elbasvir+grazoprevir: [zepatier]
  fenoterol+ipratropium: [berodual]
  ipratropium+salbutamol: [combivent]
  isoniazid+rifapentine: [3hp, 1hp]
  # drug classes (a class name satisfies ONE item that needs one member)
  tenofovir-disoproxil|tenofovir-alafenamide: [tenofovir]
