name: tests

# Manual trigger for now: GitHub Actions is unavailable on this account until a billing issue is resolved.
# When it is, restore:  push: {branches: [main]}  and  pull_request:  (and the README badge).
on:
  workflow_dispatch:

jobs:
  test:
    # The project is developed on Windows (paths, encodings, Word/PowerShell tooling), so CI mirrors it.
    runs-on: windows-latest
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Lint
        run: python -m ruff check src scripts tests .claude/hooks
      - name: Tests (official MoH PDFs are not redistributed, so raw-data tests are skipped)
        run: python -m pytest -m "not raw_data"
      - name: Numbers registry (abstracts use only registered numbers)
        run: python -m vnsoc.numbers verify manuscript/fmc/abstract_fmc.md manuscript/fmc/abstract_fmc_250.md
